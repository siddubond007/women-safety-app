services:
  - type: web
    name: sakhi-staging-api
    branch: feat/module1-redesign-identity-provider
    autoDeployTrigger: commit
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: SAKHI_ENV
        value: staging
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: SAKHI_OTP_MODE
        value: staging_test
      - key: SAKHI_STAGING_TEST_MINIMUM_AGE_YEARS
        value: "18"
      - key: SAKHI_APP_DATABASE_URL
        sync: false
      - key: SAKHI_STAGING_TEST_PHONE_ALLOWLIST
        sync: false
      - key: SAKHI_STAGING_TEST_OTP_CODE
        sync: false
      - key: SAKHI_ADMIN_CORS_ORIGIN
        value: https://sakhi-staging-admin.onrender.com
      - key: SAKHI_STAGING_TEST_ADMIN_ENABLED
        value: "true"
      - key: SAKHI_STAGING_TEST_ADMIN_TOKEN
        generateValue: true
      - key: SAKHI_STAGING_TEST_ADMIN_REVIEWER_LABEL
        value: Sakhi Friend Testing Reviewer
      - key: SAKHI_STAGING_FULL_ADMIN_ENABLED
        value: "true"
      - key: SAKHI_STAGING_FULL_ADMIN_TOKEN
        generateValue: true
      - key: SAKHI_STAGING_FULL_ADMIN_REVIEWER_LABEL
        value: Sakhi Staging Super Admin
      - key: SAKHI_GOOGLE_DRIVE_CLIENT_ID
        sync: false
      - key: SAKHI_GOOGLE_DRIVE_CLIENT_SECRET
        sync: false
      - key: SAKHI_GOOGLE_DRIVE_REFRESH_TOKEN
        sync: false
      - key: SAKHI_GOOGLE_DRIVE_ROOT_FOLDER_NAME
        value: Sakhi Staging Media
      # Decentro DigiLocker staging. Real provider sessions still require server-side credentials.
      # The independent demo path uses synthetic outcomes only and never verifies/persists identity.
      - key: DECENTRO_BASE_URL
        value: https://in.staging.decentro.tech
      - key: APP_VERIFICATION_CALLBACK_URL
        value: https://sakhi-staging-api.onrender.com/api/v1/eligibility/decentro/callback
      - key: SAKHI_DECENTRO_POLICY_APPROVED
        value: "false"
      - key: SAKHI_ENABLE_LOCAL_ELIGIBILITY_SIMULATOR
        value: "false"
      - key: SAKHI_ENABLE_STAGING_ELIGIBILITY_DEMO
        value: "true"
      - key: DECENTRO_CLIENT_ID
        sync: false
      - key: DECENTRO_CLIENT_SECRET
        sync: false
      - key: DECENTRO_KYC_MODULE_SECRET
        sync: false
      # Only populate DECENTRO_WEBHOOK_SECRET if a separate HMAC callback adapter is confirmed.
      - key: DECENTRO_WEBHOOK_SECRET
        sync: false

  - type: web
    name: sakhi-staging-admin
    branch: feat/module1-redesign-identity-provider
    autoDeployTrigger: commit
    runtime: static
    rootDir: super-admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sakhi-staging-api.onrender.com/api/v1
      - key: VITE_ADMIN_MODE
        value: staging-test
