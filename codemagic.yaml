workflows:
  sakhi-ios-unsigned-sideload:
    name: Sakhi iOS unsigned IPA for Windows sideloading
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
    scripts:
      - name: Show build toolchain
        script: |
          xcodebuild -version
          xcode-select -p
          flutter --version
          sw_vers
      - name: Resolve Flutter packages
        script: |
          cd "$CM_BUILD_DIR/app"
          flutter pub get
      - name: Analyze Dart source
        script: |
          cd "$CM_BUILD_DIR/app"
          flutter analyze
      - name: Run Flutter tests
        script: |
          cd "$CM_BUILD_DIR/app"
          flutter test
      - name: Build iOS release without Apple code signing
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/app"
          flutter build ios --release --no-codesign \
            --dart-define=SAKHI_BACKEND_ENABLED=true \
            --dart-define=SAKHI_STAGING_TEST_MODE=true \
            --dart-define=SAKHI_API_BASE_URL=https://sakhi-staging-api.onrender.com/api/v1
      - name: Package unsigned IPA and build metadata
        script: |
          set -euo pipefail
          APP_PATH="$CM_BUILD_DIR/app/build/ios/iphoneos/Runner.app"
          OUTPUT_DIR="$CM_BUILD_DIR/app/output"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          rm -rf "$CM_BUILD_DIR/app/Payload" "$OUTPUT_DIR"
          mkdir -p "$CM_BUILD_DIR/app/Payload" "$OUTPUT_DIR"
          ditto "$APP_PATH" "$CM_BUILD_DIR/app/Payload/Runner.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$CM_BUILD_DIR/app/Payload/Runner.app/Info.plist" > "$OUTPUT_DIR/BUNDLE_IDENTIFIER.txt"
          {
            echo "Sakhi iOS unsigned sideload build"
            echo "Repository: siddubond007/women-safety-app"
            echo "Git commit: ${CM_COMMIT:-unknown}"
            echo "Build ID: ${CM_BUILD_ID:-unknown}"
            echo "Bundle identifier: $(cat "$OUTPUT_DIR/BUNDLE_IDENTIFIER.txt")"
            echo "API base URL: https://sakhi-staging-api.onrender.com/api/v1"
            echo "Compile defines: SAKHI_BACKEND_ENABLED=true; SAKHI_STAGING_TEST_MODE=true"
            echo "Signing: unsigned; use a Windows sideloading tool to sign/install with your own Apple Account"
            echo "Limit: free Apple Account signing normally expires after 7 days"
          } > "$OUTPUT_DIR/BUILD_INFO.txt"
          cd "$CM_BUILD_DIR/app"
          /usr/bin/zip -qry "$OUTPUT_DIR/Sakhi-iOS-unsigned.ipa" Payload
          unzip -l "$OUTPUT_DIR/Sakhi-iOS-unsigned.ipa" | grep -F 'Payload/Runner.app/Info.plist'
          shasum -a 256 "$OUTPUT_DIR/Sakhi-iOS-unsigned.ipa" > "$OUTPUT_DIR/SHA256SUMS.txt"
          rm -rf "$CM_BUILD_DIR/app/Payload"
    artifacts:
      - app/output/Sakhi-iOS-unsigned.ipa
      - app/output/BUILD_INFO.txt
      - app/output/BUNDLE_IDENTIFIER.txt
      - app/output/SHA256SUMS.txt
      - /tmp/xcodebuild_logs/*.log
