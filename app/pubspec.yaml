name: women_safety_app
description: "Sakhi — Women's Safety, Community & Wellness Application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.2.0
  cupertino_icons: ^1.0.8
  video_player: 2.14.1
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFF4F7"
  adaptive_icon_foreground: "assets/brand/app_icon.png"
  web:
    generate: true
    image_path: "assets/brand/app_icon.png"
    background_color: "#FFF4F7"
    theme_color: "#79318A"

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/images/onboarding/
    - assets/images/illustrations/
    - assets/images/illustrations/flowers/
    - assets/images/home/
    - assets/images/explore/
    - assets/images/community/
    - assets/images/wellness/
    - assets/images/safety/
    - assets/images/profile/
    - assets/icons/
