name: Prisma 7 Effect Override Validation

on:
  push:
    branches:
      - fix/prisma-effect-redos-20261123

permissions:
  contents: write

concurrency:
  group: prisma-effect-override
  cancel-in-progress: false

jobs:
  verify:
    name: Audit and validate Prisma 7 override
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Regenerate lockfile with the targeted Effect override
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lockfile to the hotfix branch
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[lockfile-refresh]')
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Generated package lockfile is already current."
            exit 0
          fi
          git commit -m "chore: lock Prisma 7 Effect 3.22.1 override [lockfile-refresh]"
          git push origin HEAD:refs/heads/fix/prisma-effect-redos-20261123

      - name: Install the exact locked dependencies
        run: npm ci --include=dev

      - name: Verify installed Prisma and Effect versions
        run: npm ls prisma @prisma/config effect

      - name: Audit full and production dependency trees
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > "$RUNNER_TEMP/audit-full.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-production.json" || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const full = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/audit-full.json`, 'utf8'));
          const production = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/audit-production.json`, 'utf8'));
          const summarize = (name, report) => {
            const counts = report.metadata?.vulnerabilities ?? {};
            const vulnerablePackages = Object.entries(report.vulnerabilities ?? {}).map(([packageName, item]) => ({
              package: packageName,
              severity: item.severity,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: item.via,
            }));
            console.log(JSON.stringify({ scope: name, counts, vulnerablePackages }));
            return (counts.high ?? 0) + (counts.critical ?? 0);
          };
          const fullHighCritical = summarize('all-dependencies', full);
          const productionHighCritical = summarize('production-dependencies', production);
          if (fullHighCritical > 0 || productionHighCritical > 0) {
            console.error('High/critical dependency advisories remain.');
            process.exitCode = 1;
          }
          NODE

      - name: Backend typecheck
        run: npm run typecheck

      - name: Backend tests
        run: npm test

      - name: Backend build
        run: npm run build

      - name: Upload generated lockfile and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prisma-effect-override-verification
          path: |
            backend/package-lock.json
            ${{ runner.temp }}/audit-full.json
            ${{ runner.temp }}/audit-production.json
          if-no-files-found: error
          retention-days: 7
