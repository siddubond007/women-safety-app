name: Export canonical Sakhi main source ZIP

on:
  push:
    branches:
      - temp/source-archive-export-20261106

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main commit
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
          fetch-depth: 1

      - name: Create source archive without credentials or build caches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib

          root = Path(".").resolve()
          out = Path("/tmp/Sakhi_Main_d304f119_Source.zip")
          excluded_dirs = {
              ".git", ".dart_tool", ".gradle", "node_modules", "build",
              "coverage", "Pods", "DerivedData", ".idea", ".pytest_cache",
              "__pycache__", ".next", ".turbo"
          }
          excluded_names = {
              "key.properties", "sakhi-release-key.jks",
              "id_rsa", "id_ed25519", "known_hosts"
          }
          excluded_suffixes = {".jks", ".keystore", ".p12", ".pfx", ".pem"}
          excluded_env = {".env", ".env.local", ".env.development", ".env.production",
                          ".env.staging", ".env.test"}
          included = []
          skipped = []

          with ZipFile(out, "w", ZIP_DEFLATED, compresslevel=6) as zf:
              for path in root.rglob("*"):
                  rel = path.relative_to(root)
                  parts = rel.parts
                  if any(part in excluded_dirs for part in parts):
                      continue
                  if not path.is_file():
                      continue
                  name = path.name
                  sensitive = (
                      name in excluded_names or name in excluded_env or
                      path.suffix.lower() in excluded_suffixes or
                      name.startswith(".env.") or
                      "service-account" in name.lower() or
                      "credentials" in name.lower() and name.lower().endswith(".json")
                  )
                  if sensitive:
                      skipped.append(rel.as_posix())
                      continue
                  if rel.as_posix() == out.name:
                      continue
                  zf.write(path, rel.as_posix())
                  included.append(rel.as_posix())

          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          print(f"ARCHIVE={out}")
          print(f"FILES_INCLUDED={len(included)}")
          print(f"FILES_EXCLUDED_AS_SENSITIVE={len(skipped)}")
          print(f"SIZE_BYTES={out.stat().st_size}")
          print(f"SHA256={digest}")
          print("EXCLUDED_PATHS:")
          for item in skipped:
              print(item)
          PY

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Sakhi_Main_d304f119_Source
          path: /tmp/Sakhi_Main_d304f119_Source.zip
          if-no-files-found: error
          retention-days: 7
