name: Sakhi community follower RLS performance migration

on:
  workflow_dispatch:
    inputs:
      apply_community_follower_rls:
        description: "Apply only the reviewed community follower RLS migration to staging"
        required: true
        type: boolean
        default: false
      approval_phrase:
        description: "Enter YES_APPLY_20261120_COMMUNITY_FOLLOWERS_RLS exactly"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sakhi-staging-community-follower-rls
  cancel-in-progress: false

jobs:
  apply-community-follower-rls:
    name: Apply exact community follower RLS migration to protected staging
    if: inputs.apply_community_follower_rls == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    defaults:
      run:
        working-directory: backend
    env:
      SAKHI_ENV: staging
      SAKHI_MIGRATION_TARGET: 20261120130000_community_followers_rls_performance
      SAKHI_ALLOW_STAGING_MIGRATIONS: ${{ inputs.approval_phrase }}
      SAKHI_MIGRATOR_DATABASE_URL: ${{ secrets.SAKHI_STAGING_MIGRATOR_DATABASE_URL }}
      SAKHI_STAGING_POSTGRES_DATABASE_URL: ${{ secrets.SAKHI_STAGING_POSTGRES_DATABASE_URL }}
    steps:
      - name: Checkout exact reviewed PR #56 source
        uses: actions/checkout@v4
        with:
          ref: 197552accbd69a4fcc08130f1a0e7bb013189b37

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked backend dependencies
        run: npm ci --include=dev

      - name: Prepare and verify pinned Supabase Root 2021 CA
        run: |
          bash ./scripts/prepare-staging-db-ca.sh
          cp "${RUNNER_TEMP}/prod-ca-2021.crt" prod-ca-2021.crt
          test -s prod-ca-2021.crt

      - name: Validate exact approval and staging target before any DDL
        shell: bash
        run: |
          set -euo pipefail
          test "${SAKHI_ALLOW_STAGING_MIGRATIONS}" = "YES_APPLY_20261120_COMMUNITY_FOLLOWERS_RLS" || { echo "::error::Exact community follower RLS approval phrase was not supplied."; exit 1; }
          test -n "${SAKHI_MIGRATOR_DATABASE_URL}" || { echo "::error::Missing SAKHI_STAGING_MIGRATOR_DATABASE_URL secret."; exit 1; }
          test -n "${SAKHI_STAGING_POSTGRES_DATABASE_URL}" || { echo "::error::Missing SAKHI_STAGING_POSTGRES_DATABASE_URL secret."; exit 1; }
          test -s "${RUNNER_TEMP}/prod-ca-2021.crt"

      - name: Verify exact pending migration set and apply with postflight
        run: |
          node scripts/staging-preflight.cjs migrations
          node scripts/staging-community-follower-rls-migration.cjs

      - name: Remove temporary CA files
        if: always()
        run: rm -f "${RUNNER_TEMP}/prod-ca-2021.crt" prod-ca-2021.crt
