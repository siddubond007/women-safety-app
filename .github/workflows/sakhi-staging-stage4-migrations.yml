name: Sakhi Stage 4 reviewed RBAC and RLS migrations

on:
  push:
    branches:
      - security/stage4a-remediation-stage4b-rls-20261119
  workflow_dispatch:
    inputs:
      apply_stage4:
        description: "Apply the exact reviewed Stage 4A/4B migrations to Supabase staging"
        required: true
        type: boolean
        default: false
      approval_phrase:
        description: "Enter YES_APPLY_20261119_STAGE4_RBAC_RLS exactly"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sakhi-staging-stage4-migrations
  cancel-in-progress: false

jobs:
  apply-stage4:
    name: Apply Stage 4A/4B to protected staging
    if: github.event_name == 'workflow_dispatch' && inputs.apply_stage4 == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    defaults:
      run:
        working-directory: backend
    env:
      SAKHI_ENV: staging
      SAKHI_MIGRATION_TARGET: 20261118130000_remove_legacy_admin_mfa_flag,20261119140000_admin_staff_role_constraints,20261119150000_secure_admin_bootstrap_function_search_path,20261119160000_revoke_data_api_roles_from_member_data
      SAKHI_ALLOW_STAGING_MIGRATIONS: ${{ inputs.approval_phrase }}
      SAKHI_MIGRATOR_DATABASE_URL: ${{ secrets.SAKHI_STAGING_MIGRATOR_DATABASE_URL }}
      SAKHI_STAGING_POSTGRES_DATABASE_URL: ${{ secrets.SAKHI_STAGING_POSTGRES_DATABASE_URL }}
      SAKHI_STAGING_SUPABASE_CA_CERT: ${{ secrets.SAKHI_STAGING_SUPABASE_CA_CERT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked backend dependencies
        run: npm ci --include=dev

      - name: Validate explicit approval and protected staging credentials
        shell: bash
        run: |
          set -euo pipefail
          test "${SAKHI_ALLOW_STAGING_MIGRATIONS}" = "YES_APPLY_20261119_STAGE4_RBAC_RLS" || { echo "::error::Exact Stage 4 approval phrase was not supplied."; exit 1; }
          test -n "${SAKHI_MIGRATOR_DATABASE_URL}" || { echo "::error::Missing SAKHI_STAGING_MIGRATOR_DATABASE_URL secret."; exit 1; }
          test -n "${SAKHI_STAGING_POSTGRES_DATABASE_URL}" || { echo "::error::Missing SAKHI_STAGING_POSTGRES_DATABASE_URL secret. Stage 4 requires the restricted postgres role."; exit 1; }
          test -n "${SAKHI_STAGING_SUPABASE_CA_CERT}" || { echo "::error::Missing Supabase CA certificate secret."; exit 1; }
          umask 077
          printf '%s\n' "${SAKHI_STAGING_SUPABASE_CA_CERT}" > prod-ca-2021.crt
          grep -q -- "-----BEGIN CERTIFICATE-----" prod-ca-2021.crt
          grep -q -- "-----END CERTIFICATE-----" prod-ca-2021.crt

      - name: Apply Stage 4 migrations with owner-aware preflight and postflight
        run: bash ./scripts/staging-apply-stage4-reviewed.sh

      - name: Remove temporary CA file
        if: always()
        run: rm -f prod-ca-2021.crt

  reconcile-stage4-ledger:
    name: Reconcile Prisma history after verified Stage 4 DDL
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[STAGE4_LEDGER_RESOLVE]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    defaults:
      run:
        working-directory: backend
    env:
      SAKHI_ENV: staging
      SAKHI_MIGRATION_TARGET: 20261119140000_admin_staff_role_constraints,20261119150000_secure_admin_bootstrap_function_search_path,20261119160000_revoke_data_api_roles_from_member_data
      SAKHI_ALLOW_STAGING_MIGRATIONS: YES_APPLY_20261119_STAGE4_RBAC_RLS
      SAKHI_MIGRATOR_DATABASE_URL: ${{ secrets.SAKHI_STAGING_MIGRATOR_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked backend dependencies
        run: npm ci --include=dev

      - name: Prepare verified Supabase CA
        shell: bash
        env:
          SAKHI_STAGING_SUPABASE_CA_CERT: ${{ secrets.SAKHI_STAGING_SUPABASE_CA_CERT }}
        run: |
          set -euo pipefail
          test -n "${SAKHI_STAGING_SUPABASE_CA_CERT}" || { echo "::error::Missing Supabase CA certificate secret."; exit 1; }
          umask 077
          printf '%s\n' "${SAKHI_STAGING_SUPABASE_CA_CERT}" > prod-ca-2021.crt
          grep -q -- "-----BEGIN CERTIFICATE-----" prod-ca-2021.crt
          grep -q -- "-----END CERTIFICATE-----" prod-ca-2021.crt

      - name: Verify exact pending migration set
        run: node scripts/staging-preflight.cjs migrations

      - name: Verify Stage 4 database postconditions and reconcile Prisma ledger
        run: node scripts/staging-stage4-ledger-resolve.cjs

      - name: Verify migration status
        run: npm run db:migrate:status

      - name: Remove temporary CA file
        if: always()
        run: rm -f prod-ca-2021.crt
