name: Sakhi Flutter CI

on:
  workflow_dispatch:
  push:
    branches:
      - feat/stage3e-account-deletion-complaint-evidence-20261110
    paths:
      - "app/**"
      - "backend/**"
      - ".github/workflows/sakhi-flutter-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "backend/**"
      - ".github/workflows/sakhi-flutter-ci.yml"

permissions:
  contents: read

concurrency:
  group: sakhi-stage3e-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend unit tests
        run: npm test -- --reporter=dot

      - name: Build backend
        run: npm run build

  flutter:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Resolve locked dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter source
        run: flutter analyze

      - name: Run Flutter unit and widget tests
        run: flutter test --reporter expanded

  android-emulator-smoke:
    name: Android APK build and emulator launch smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Free build-only SDK space before emulator setup
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          rm -rf "$SDK_ROOT/ndk" "$SDK_ROOT/cmake"
          rm -rf "$HOME/.gradle/caches" "$HOME/.gradle/daemon" "$HOME/.gradle/wrapper/dists"
          rm -rf "$HOME/.pub-cache" "$FLUTTER_ROOT"
          df -h "$SDK_ROOT"

      - name: Install and launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 768M
          # Avoid extra adb settings writes that caused a broken-pipe failure
          # after the emulator had already booted on the hosted runner.
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb wait-for-device
            for attempt in 1 2 3; do
              if adb install --no-streaming -r app/build/app/outputs/flutter-apk/app-debug.apk; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "APK installation failed after three non-streaming attempts."
                adb shell dumpsys meminfo || true
                adb logcat -d -t 1000 || true
                exit 1
              fi
              echo "APK installation attempt $attempt failed; waiting for package manager recovery."
              sleep 10
              adb wait-for-device
            done
            adb shell monkey -p com.example.women_safety_app 1
            sleep 20
            adb shell pidof com.example.women_safety_app
            if adb logcat -d -t 3000 | grep -E "FATAL EXCEPTION|Process: com.example.women_safety_app" ; then
              echo "Fatal app crash detected during emulator launch."
              exit 1
            fi

      - name: Upload debug APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sakhi-stage3e-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
