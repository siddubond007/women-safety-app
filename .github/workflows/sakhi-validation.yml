name: Sakhi validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - module7-fix-version-3
      - release/complete-enterprise-fix
      - gemini-module-2
      - module-proper-continuation
      - feat/admin-eligibility-review-backend
    paths:
      - "backend/**"
      - "super-admin/**"
      - "app/**"
      - ".github/workflows/sakhi-validation.yml"
  pull_request:
    branches:
      - main
      - develop
      - module7-fix-version-3
      - release/complete-enterprise-fix
      - gemini-module-2
      - module-proper-continuation
      - feat/admin-eligibility-review-backend
    paths:
      - "backend/**"
      - "super-admin/**"
      - "app/**"
      - ".github/workflows/sakhi-validation.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Backend schema, types, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npm run prisma:validate
      - name: Type-check source and tests
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build backend
        run: npm run build

  super-admin:
    name: Super Admin type-check, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: super-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: super-admin/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  flutter:
    name: Flutter analysis, tests and optional Signed Release APK build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Configure Android release signing from GitHub secrets
        id: android-signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_STORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release APK skipped::Android signing secrets are not configured. Flutter analysis and tests still ran."
            exit 0
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/sakhi-release-key.jks
          chmod 600 android/app/sakhi-release-key.jks
          keytool -list -keystore android/app/sakhi-release-key.jks \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -keypass "$ANDROID_KEY_PASSWORD" > /dev/null

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=sakhi-release-key.jks
          EOF
          chmod 600 android/key.properties
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Build Signed Production Release APK
        if: steps.android-signing.outputs.configured == 'true'
        run: flutter build apk --release
      - name: Upload Signed Release APK Artifact
        if: steps.android-signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Sakhi_Production_Signed_V3_APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Report skipped release artifact
        if: steps.android-signing.outputs.configured != 'true'
        run: echo "Release APK was not produced because Android signing secrets are not configured."
      - name: Remove temporary Android signing files
        if: always() && steps.android-signing.outputs.configured == 'true'
        run: rm -f android/key.properties android/app/sakhi-release-key.jks
