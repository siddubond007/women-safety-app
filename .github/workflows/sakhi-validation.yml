name: Sakhi validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - module7-fix-version-3
      - release/complete-enterprise-fix
      - gemini-module-2
      - module-proper-continuation
      - feat/admin-eligibility-review-backend
      - module-8-to-9-implementations-and-upgrades
      - gemini/sakhi-comprehensive-fixes-20261107
      - integration/sakhi-gemini-first-implementation-20261111
    paths:
      - "backend/**"
      - "super-admin/**"
      - "app/**"
      - ".github/workflows/sakhi-validation.yml"
  pull_request:
    branches:
      - main
      - develop
      - module7-fix-version-3
      - release/complete-enterprise-fix
      - gemini-module-2
      - module-proper-continuation
      - feat/admin-eligibility-review-backend
      - module-8-to-9-implementations-and-upgrades
      - gemini/sakhi-comprehensive-fixes-20261107
      - integration/sakhi-gemini-first-implementation-20261111
    paths:
      - "backend/**"
      - "super-admin/**"
      - "app/**"
      - ".github/workflows/sakhi-validation.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Backend schema, types, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit fresh staging baseline against Module 1–7 migrations
        run: node scripts/audit-staging-baseline.cjs
      - name: Validate Prisma schema
        run: npm run prisma:validate
      - name: Type-check source and tests
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build backend
        run: npm run build

  super-admin:
    name: Super Admin type-check, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: super-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: super-admin/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  flutter:
    name: Flutter analysis, tests and staging-connected debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build staging-connected debug APK
        run: >-
          flutter build apk --debug
          --dart-define=SAKHI_BACKEND_ENABLED=true
          --dart-define=SAKHI_STAGING_TEST_MODE=true
          --dart-define=SAKHI_API_BASE_URL=https://sakhi-staging-api.onrender.com/api/v1
      - name: Upload staging-connected debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakhi_Staging_Connected_Debug_APK
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
