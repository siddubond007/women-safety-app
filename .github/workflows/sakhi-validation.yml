name: Sakhi validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - module7-fix-version-3
      - release/complete-enterprise-fix
      - gemini-module-2
      - module-proper-continuation
      - feat/admin-eligibility-review-backend
      - module-8-to-9-implementations-and-upgrades
      - gemini/sakhi-comprehensive-fixes-20261107
      - integration/sakhi-gemini-first-implementation-20261111
      - fix/staging-p0-managed-role-preflight-20261113
      - fix/sakhi-runtime-db-isolation-20261113
      - fix/stage3b2-reviewed-staging-migrations-20261114
      - release/staging-apk-hosted-20261112
    paths:
      - "backend/**"
      - "super-admin/**"
      - "app/**"
      - ".github/workflows/sakhi-validation.yml"
      - "render.yaml"
  pull_request:
    branches:
      - main
      - develop
      - module7-fix-version-3
      - release/complete-enterprise-fix
      - gemini-module-2
      - module-proper-continuation
      - feat/admin-eligibility-review-backend
      - module-8-to-9-implementations-and-upgrades
      - gemini/sakhi-comprehensive-fixes-20261107
      - integration/sakhi-gemini-first-implementation-20261111
      - fix/staging-p0-managed-role-preflight-20261113
      - fix/sakhi-runtime-db-isolation-20261113
      - release/staging-apk-hosted-20261112
    paths:
      - "backend/**"
      - "super-admin/**"
      - "app/**"
      - ".github/workflows/sakhi-validation.yml"
      - "render.yaml"

permissions:
  contents: read

jobs:
  backend:
    if: github.event_name != 'workflow_dispatch'
    name: Backend schema, types, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit fresh staging baseline against Module 1–7 migrations
        run: node scripts/audit-staging-baseline.cjs
      - name: Validate Prisma schema
        run: npm run prisma:validate
      - name: Type-check source and tests
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build backend
        run: npm run build

  admin-review-postgres17:
    if: github.event_name != 'workflow_dispatch'
    name: Admin review integration on isolated PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sakhi-ci-postgres
          POSTGRES_DB: sakhi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sakhi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: sakhi-ci-postgres
      PGDATABASE: sakhi_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run isolated PostgreSQL 17 admin-review integration
        run: bash scripts/test-admin-review-database-integration.sh

  super-admin:
    if: github.event_name != 'workflow_dispatch'
    name: Super Admin type-check, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: super-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: super-admin/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  flutter:
    if: github.event_name != 'workflow_dispatch'
    name: Flutter analysis, tests and staging-connected debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build staging-connected debug APK
        run: >-
          flutter build apk --debug
          --dart-define=SAKHI_BACKEND_ENABLED=true
          --dart-define=SAKHI_STAGING_TEST_MODE=true
          --dart-define=SAKHI_API_BASE_URL=https://sakhi-staging-api.onrender.com/api/v1
      - name: Upload staging-connected debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakhi_Staging_Connected_Debug_APK
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  staging-staff-mfa:
    name: Manual staging staff MFA lifecycle verification
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: sakhi-staging-staff-mfa
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    env:
      SAKHI_ENV: staging
      NODE_ENV: production
      SAKHI_STAGING_MFA_DB_INTEGRATION: "true"
      SAKHI_APP_DATABASE_URL: ${{ secrets.SAKHI_STAGING_APP_DATABASE_URL }}
      SAKHI_MIGRATOR_DATABASE_URL: ${{ secrets.SAKHI_STAGING_MIGRATOR_DATABASE_URL }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Verify protected staging credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SAKHI_APP_DATABASE_URL" || { echo "::error::Missing staging environment secret SAKHI_STAGING_APP_DATABASE_URL"; exit 1; }
          test -n "$SAKHI_MIGRATOR_DATABASE_URL" || { echo "::error::Missing staging environment secret SAKHI_STAGING_MIGRATOR_DATABASE_URL"; exit 1; }
      - name: Provision and verify Supabase staging CA
        run: bash scripts/prepare-staging-db-ca.sh
      - name: Install locked dependencies including test tooling
        # NODE_ENV=production is required by the staging safety guard, but npm ci
        # otherwise omits devDependencies such as Vitest. Explicitly include them.
        run: npm ci --include=dev
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Run synthetic staging staff MFA lifecycle
        run: npx vitest run test/admin-mfa.database.integration.spec.ts --reporter=verbose
